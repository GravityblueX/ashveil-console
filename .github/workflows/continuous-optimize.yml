name: Continuous Optimization & Release

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm run install:all

      - name: Format Workspace
        run: npm run format

      - name: Release Readiness
        run: npm run release:readiness

      - name: Upload Readiness Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-readiness-reports
          path: reports/
          if-no-files-found: ignore

      - name: Auto Commit Improvements
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(auto): optimization round ${{ github.run_number }}'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: Auto Release v0.${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          draft: false
